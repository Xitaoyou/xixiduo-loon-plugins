name: Update free nodes
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: free-nodes-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/free-nodes/requirements.txt
      - run: python -m unittest discover -s scripts/free-nodes -p 'test_*.py'
      - run: python scripts/free-nodes/update.py
      - name: Publish subscription
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add subscriptions/free-nodes.txt subscriptions/free-nodes.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: update experimental free subscription'
            git push
          fi
