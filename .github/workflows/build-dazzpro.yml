name: build-dazzpro

on:
  workflow_dispatch:
  push:
    paths:
      - "dazzpro/**"
      - ".github/workflows/build-dazzpro.yml"

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        run: |
          brew install ldid xz || true
          export THEOS="$RUNNER_TEMP/theos"
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          curl -fsSL https://github.com/theos/sdks/archive/master.zip -o "$RUNNER_TEMP/sdks.zip"
          unzip -q "$RUNNER_TEMP/sdks.zip" -d "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/sdks-master" "$THEOS/sdks"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "$THEOS/bin" >> "$GITHUB_PATH"

      - name: Build rootful deb
        working-directory: dazzpro
        run: |
          make clean || true
          make package FINALPACKAGE=1
          mkdir -p ../out
          cp packages/*.deb ../out/dazzpro-rootful.deb

      - name: Build rootless deb
        working-directory: dazzpro
        run: |
          make clean || true
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          cp packages/*.deb ../out/dazzpro-rootless.deb

      - name: Build injectable dylib
        working-directory: dazzpro
        run: |
          make clean || true
          make ARCHS=arm64
          find .theos -name DazzPro.dylib -exec cp {} ../out/DazzPro.dylib \;
          ls -l ../out

      - uses: actions/upload-artifact@v4
        with:
          name: DazzPro-build
          path: out/*
          if-no-files-found: error