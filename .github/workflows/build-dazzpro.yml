name: build-dazzpro

on:
  workflow_dispatch:
  push:
    paths:
      - "dazzpro/**"
      - ".github/workflows/build-dazzpro.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install host deps
        run: |
          available() { apt-cache policy "$1" 2>/dev/null | grep -q "Candidate: [^(]"; }
          LIBXML2=$(available libxml2 && echo libxml2 || echo libxml2-16)
          GOLD=$(available binutils-gold && echo binutils-gold || true)
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential fakeroot rsync curl perl zip git wget xz-utils \
            "$LIBXML2" libncurses6 libtinfo6 libz3-dev libplist-utils libssl-dev $GOLD
          LIBDIR=/usr/lib/$(dpkg-architecture -qDEB_HOST_MULTIARCH)
          if [ ! -e "$LIBDIR/libxml2.so.2" ] && [ -e "$LIBDIR/libxml2.so.16" ]; then
            sudo ln -s libxml2.so.16 "$LIBDIR/libxml2.so.2"
          fi
          gcc --version | head -1
      - name: Install Theos + toolchain + SDKs
        run: |
          export THEOS="$RUNNER_TEMP/theos"
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/toolchain" "$THEOS/sdks"
          wget --no-verbose https://github.com/kabiroberai/swift-toolchain-linux/releases/download/v2.3.0/swift-5.8-ubuntu22.04.tar.xz -P "$RUNNER_TEMP"
          tar -xf "$RUNNER_TEMP/swift-5.8-ubuntu22.04.tar.xz" -C "$THEOS/toolchain"
          ls "$THEOS/toolchain/linux/iphone/bin" | head
          wget --no-verbose https://github.com/theos/sdks/archive/master.tar.gz -O "$RUNNER_TEMP/sdks.tar.gz"
          tar -xzf "$RUNNER_TEMP/sdks.tar.gz" -C "$RUNNER_TEMP"
          mv "$RUNNER_TEMP"/sdks-master/*.sdk "$THEOS/sdks"
          ls "$THEOS/sdks" | head
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "$THEOS/bin" >> "$GITHUB_PATH"

      - name: Build rootful deb
        working-directory: dazzpro
        run: |
          mkdir -p ../out
          make clean || true
          rm -f packages/*.deb
          make package FINALPACKAGE=1 ARCHS=arm64
          cp "$(ls -t packages/*.deb | head -n1)" ../out/dazzpro-rootful.deb

      - name: Build rootless deb
        working-directory: dazzpro
        run: |
          mkdir -p ../out
          make clean || true
          rm -f packages/*.deb
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          cp "$(ls -t packages/*.deb | head -n1)" ../out/dazzpro-rootless.deb

      - name: Build injectable dylib
        working-directory: dazzpro
        run: |
          mkdir -p ../out
          make clean || true
          rm -f packages/*.deb
          make ARCHS=arm64
          find .theos -name DazzPro.dylib -exec cp {} ../out/DazzPro.dylib \;
          ls -l ../out

      - uses: actions/upload-artifact@v4
        with:
          name: DazzPro-build
          path: out/*
          if-no-files-found: error